<style>
/* Layout: phone-first app shell. Sticky title bar, one 760px column, fixed bottom tab bar, full-screen sheets for editing; documents preview as true-proportion A4 paper.
   Single dark theme on purpose: KABA BOY TV black with the logo's orange (#F87400). */
:root {
  --bg: #070707;
  --surface: #121212;
  --surface-2: #1D1B19;
  --ink: #F6F1EA;
  --ink-2: #A9A198;
  --line: #2B2724;
  --accent: #F87400;
  --accent-ink: #0A0A0A;
  --accent-soft: #33200C;
  --series-2: #CFC6BA;
  --ok: #3FD68B;
  --ok-soft: #0F2E20;
  --warn: #F5C542;
  --warn-soft: #33290C;
  --bad: #FF5D5D;
  --bad-soft: #3A1414;
  --scrim: rgb(0 0 0 / .72);
  --paper: #FFFFFF;
  --paper-ink: #1B1B1F;
  --paper-muted: #6B6F7A;
  --paper-line: #D9DCE3;
  --paper-head: #F3F1EE;
  --stamp-ok: #157A4B;
  --stamp-bad: #C0282B;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-paper: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 14px;
  --tabh: 64px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.top h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.025em; line-height: 1.08; margin: 0; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 2px var(--accent-soft); }
main { padding-bottom: calc(var(--tabh) + 32px + env(safe-area-inset-bottom, 0px)); }

.yearsw { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; flex-shrink: 0; }
.yearsw button { appearance: none; border: 0; background: none; width: 36px; height: 36px; border-radius: 99px; cursor: pointer; color: var(--ink-2); display: grid; place-items: center; }
.yearsw button:disabled { opacity: .35; cursor: default; }
.yearsw b { font-family: var(--f-mono); font-weight: 500; font-size: .9rem; min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabh); }
.tab { appearance: none; border: 0; background: none; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 11px/1 var(--f-body); cursor: pointer; border-radius: 12px; position: relative; }
.tab svg.ic { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .dot { position: absolute; top: 9px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; }

svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.banner { margin-top: 6px; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: .86rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner button { appearance: none; border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }

.sec { margin-top: 26px; }
.sec:first-child { margin-top: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 9px; }
.sec-h h2 { font: 700 .74rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); margin: 0; }
.sec-h .link { appearance: none; border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .86rem; cursor: pointer; padding: 4px 0; }

.hero { padding-block: 4px 0; }
.hero-l { color: var(--ink-2); font-size: .86rem; }
.hero-n { color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: clamp(2.5rem, 12vw, 3.5rem); letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.hero-n.neg { color: var(--bad); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.fig-l { font-size: .78rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.fig-l i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.fig-n { font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; color: inherit; cursor: pointer; min-height: 60px; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.item-main { flex: 1; min-width: 0; }
.item-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-s { color: var(--ink-2); font-size: .8rem; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.item-r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.item .lead { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); color: var(--ink-2); }
.item .lead.in { background: var(--accent-soft); color: var(--accent); }
.item .lead.warn { background: var(--warn-soft); color: var(--warn); }
.item .lead.bad { background: var(--bad-soft); color: var(--bad); }
.item .lead.ok { background: var(--ok-soft); color: var(--ok); }
.group-h { display: flex; justify-content: space-between; padding: 8px 14px; background: var(--surface-2); font-size: .76rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.group-h span:last-child { font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }

.amt { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
.amt.out { color: var(--ink); }
.amt.in { color: var(--ok); }
.mono { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .01em; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 8px 2px 7px; font-size: .72rem; font-weight: 650; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.tag { display: inline-block; border: 1px dashed currentColor; color: var(--ink-2); border-radius: 6px; padding: 0 5px; font-size: .68rem; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .9rem/1.1 var(--f-body); padding: 10px 14px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; min-height: 44px; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 36px; padding: 7px 11px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.block { width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions.end { justify-content: flex-end; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .btn { justify-content: flex-start; padding: 13px 14px; min-height: 52px; }
.quick .btn svg { color: var(--accent); }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; appearance: none; border: 0; background: none; color: var(--ink-2); font: 600 .85rem/1.1 var(--f-body); padding: 10px 6px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 99px; padding: 7px 12px; font: 600 .82rem/1 var(--f-body); white-space: nowrap; cursor: pointer; flex-shrink: 0; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.search { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.toolbar .grow { flex: 1; min-width: 160px; }

.empty { padding: 28px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 4px; }
.hint { font-size: .8rem; color: var(--ink-2); margin: 6px 0 0; }
.fine { font-size: .76rem; color: var(--ink-2); margin-top: 24px; max-width: 62ch; }

.meter { margin-top: 10px; }
.meter-bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter-bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.meter-bar.warn span { background: var(--warn); }
.meter-bar.bad span { background: var(--bad); }
.meter-l { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.panel p { margin: 0; }

.chart { width: 100%; height: auto; display: block; }
.chart text { font: 500 9px var(--f-body); fill: var(--ink-2); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .b-in { fill: var(--accent); }
.chart .b-out { fill: var(--series-2); }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.euer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.euer-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.euer-row:first-child { border-top: 0; }
.euer-row span { min-width: 0; }
.euer-row small { display: block; color: var(--ink-2); font-size: .74rem; }
.euer-row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.euer-row.total { background: var(--accent); color: var(--accent-ink); }
.euer-row.total small { color: inherit; opacity: .7; }
.euer-row.total b { font-family: var(--f-display); font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; }
.tbl-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.tbl-row:first-child { border-top: 0; }
.tbl-row > span { min-width: 0; }
.tbl-row small { display: block; color: var(--ink-2); font-size: .74rem; }
.tbl-row b { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 650; }
.tbl-row.sum { background: var(--surface-2); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
.check .mk.ok { background: var(--ok-soft); color: var(--ok); }
.check .mk.warn { background: var(--warn-soft); color: var(--warn); }
.check .mk svg { width: 14px; height: 14px; }
.check-main { flex: 1; min-width: 0; }
.check-main small { display: block; color: var(--ink-2); font-size: .78rem; }
.check .btn { flex-shrink: 0; }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; animation: sheet-up .2s ease-out; }
@keyframes sheet-up { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-h { flex-shrink: 0; padding-top: env(safe-area-inset-top, 0px); background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-h-in { display: flex; align-items: center; gap: 6px; min-height: 58px; max-width: 760px; margin: 0 auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.sheet-h h2 { flex: 1; min-width: 0; font: 800 1.12rem/1.2 var(--f-display); letter-spacing: -.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { appearance: none; border: 0; background: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--ink); flex-shrink: 0; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn svg { width: 22px; height: 22px; }
.sheet-b { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-b-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(40px + env(safe-area-inset-bottom, 0px)); }

.form { display: grid; gap: 16px; }
.fs { display: grid; gap: 12px; }
.fs > h3 { font: 700 .74rem/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); margin: 6px 0 0; }
.f { display: grid; gap: 5px; min-width: 0; }
.f > label, .f > .lab { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }
.f textarea { min-height: 76px; resize: vertical; }
.f input[readonly] { background: var(--surface-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid2.wrap1 { grid-template-columns: 1fr; } }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex-shrink: 0; }
.toggle small { display: block; color: var(--ink-2); font-size: .78rem; }
.err { color: var(--bad); font-size: .86rem; font-weight: 600; min-height: 1em; }

.line { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; background: var(--surface); }
.line .f input { min-height: 42px; }
.line-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.line-foot .amt { font-size: .92rem; }
.line-n { font-family: var(--f-mono); font-size: .72rem; color: var(--ink-2); }
.totals { display: grid; gap: 6px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.totals div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.totals .grand { font-weight: 800; font-family: var(--f-display); font-size: 1.25rem; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; }

.receipt { display: flex; gap: 12px; align-items: center; padding: 10px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; flex-wrap: wrap; }
.receipt img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.receipt .pdf { width: 64px; height: 64px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; font: 700 .8rem var(--f-mono); }
.receipt-main { flex: 1; min-width: 140px; }

.doc-sum { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.doc-sum .big { font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.doc-sum .who { color: var(--ink-2); margin-top: 6px; }
.doc-actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 16px; }
.doc-actions .btn { justify-content: flex-start; }
details.pflicht { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; }
details.pflicht summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
details.pflicht summary::-webkit-details-marker { display: none; }
details.pflicht summary .pill { margin-left: auto; }
details.pflicht .check { border-top: 1px solid var(--line); }
.caption { font-size: .76rem; color: var(--ink-2); text-align: center; margin-top: 8px; }

/* A4 paper preview — measured in millimetres of a real page */
.paper-wrap { container-type: inline-size; margin-top: 18px; }
.paper { --mm: calc(100cqw / 210); position: relative; background: var(--paper); color: var(--paper-ink); font-family: var(--f-paper); font-size: calc(var(--mm) * 3.45); line-height: 1.38; aspect-ratio: 210 / 297; padding: calc(var(--mm) * 15) calc(var(--mm) * 20) calc(var(--mm) * 8); border-radius: 3px; box-shadow: 0 1px 2px rgb(0 0 0 / .1), 0 12px 32px rgb(16 26 64 / .16); display: flex; flex-direction: column; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: calc(var(--mm) * 6); min-height: calc(var(--mm) * 24); }
.p-head b { display: block; font-size: calc(var(--mm) * 5.2); }
.p-head span { color: var(--paper-muted); font-size: calc(var(--mm) * 3.1); }
.p-head img { max-width: calc(var(--mm) * 42); max-height: calc(var(--mm) * 22); object-fit: contain; }
.p-addr { display: flex; justify-content: space-between; gap: calc(var(--mm) * 8); margin-top: calc(var(--mm) * 9); }
.p-to { width: calc(var(--mm) * 85); }
.p-sender { font-size: calc(var(--mm) * 2.45); color: var(--paper-muted); border-bottom: 1px solid var(--paper-line); padding-bottom: calc(var(--mm) * .8); margin-bottom: calc(var(--mm) * 3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-info { width: calc(var(--mm) * 68); display: grid; grid-template-columns: auto 1fr; gap: calc(var(--mm) * 1) calc(var(--mm) * 3); font-size: calc(var(--mm) * 3); align-content: start; padding-top: calc(var(--mm) * 5); }
.p-info dt { color: var(--paper-muted); }
.p-info dd { margin: 0; text-align: right; font-weight: 700; }
.p-title { font-size: calc(var(--mm) * 5.6); font-weight: 700; margin-top: calc(var(--mm) * 12); }
.p-intro { margin-top: calc(var(--mm) * 2.5); }
.p-table { width: 100%; border-collapse: collapse; margin-top: calc(var(--mm) * 4); font-size: calc(var(--mm) * 3.3); }
.p-table th { background: var(--paper-head); color: var(--paper-muted); font-weight: 700; font-size: calc(var(--mm) * 2.9); text-align: left; padding: calc(var(--mm) * 1.6) calc(var(--mm) * 1.5); }
.p-table td { border-bottom: 1px solid var(--paper-line); padding: calc(var(--mm) * 1.8) calc(var(--mm) * 1.5); vertical-align: top; }
.p-table .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.p-tot { margin-left: auto; width: calc(var(--mm) * 70); margin-top: calc(var(--mm) * 3); display: grid; gap: calc(var(--mm) * 1); }
.p-tot div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.p-tot .g { border-top: 1.5px solid var(--paper-ink); padding-top: calc(var(--mm) * 1.5); font-weight: 700; font-size: calc(var(--mm) * 3.9); }
.p-notes { margin-top: calc(var(--mm) * 5); display: grid; gap: calc(var(--mm) * 2); white-space: pre-line; }
.p-foot { margin-top: auto; padding-top: calc(var(--mm) * 3); border-top: 1px solid var(--paper-line); display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: calc(var(--mm) * 4); font-size: calc(var(--mm) * 2.45); color: var(--paper-muted); line-height: 1.35; }
.p-foot > div { min-width: 0; overflow-wrap: anywhere; }
.p-stamp { position: absolute; top: 34%; right: 9%; transform: rotate(-11deg); border: calc(var(--mm) * .9) double currentColor; border-radius: calc(var(--mm) * 2); padding: calc(var(--mm) * 1.5) calc(var(--mm) * 4); color: var(--stamp-ok); font: 700 calc(var(--mm) * 6.4)/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; text-align: center; opacity: .82; mix-blend-mode: multiply; pointer-events: none; }
.p-stamp small { display: block; font-size: calc(var(--mm) * 2.6); letter-spacing: .04em; margin-top: calc(var(--mm) * 1); }
.p-stamp.bad { color: var(--stamp-bad); }

/* Modal + toast */
.modal { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .modal { align-items: center; } }
.modal-box { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 20px; max-width: 460px; width: 100%; display: grid; gap: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
.modal-box h3 { margin: 0; font: 800 1.15rem/1.25 var(--f-display); }
.modal-box p { margin: 0; color: var(--ink-2); }
.modal-box textarea { width: 100%; min-height: 180px; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(0 0 0 / .25); }

.loading { padding: 60px 0; text-align: center; color: var(--ink-2); }

/* AI reading */
.ai-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); }
.ai-card.warn { background: var(--warn-soft); }
.ai-card b { display: block; font-weight: 700; }
.ai-card p { margin: 3px 0 0; font-size: .86rem; color: var(--ink-2); }
.ai-card .actions { margin-top: 10px; }
.ai-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }
.ai-card.warn .ai-ic { background: var(--warn); color: var(--surface); }
.ai-warn { margin: 8px 0 0; padding-left: 18px; color: var(--warn); font-size: .84rem; display: grid; gap: 3px; }
.ai-dup { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .86rem; }
.f.ai-filled input, .f.ai-filled select { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.f.ai-filled > label::after { content: " · lu par l’IA"; color: var(--accent); font-weight: 600; }
.spin { width: 26px; height: 26px; margin: 6px; border: 3px solid var(--surface); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.scanbtn { justify-content: flex-start; min-height: 54px; border-color: var(--accent); }
.scanbtn svg { color: var(--accent); }


/* Signed receipt, deductions, lists */
.sig { display: grid; gap: 6px; }
.sig-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sig .lab { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.sig canvas { width: 100%; height: 170px; background: var(--paper); border: 1.5px dashed var(--line); border-radius: 12px; touch-action: none; display: block; cursor: crosshair; }
.dedline { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ai-card.soft { background: var(--surface); border: 1px dashed var(--accent); }
.bulk-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.bulk-row:first-child { border-top: 0; }
.bulk-row input { width: 22px; height: 22px; accent-color: var(--accent); margin: 2px 0 0; flex-shrink: 0; }
optgroup { font-weight: 700; }

/* Installed app: GitHub connection and receipt viewer */
.setup { display: grid; gap: 16px; }
.setup-h { font: 800 1.3rem/1.2 var(--f-display); margin: 0; letter-spacing: -.01em; }
.howto { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: .88rem; }
.howto summary { cursor: pointer; font-weight: 650; color: var(--accent); }
.howto ol { margin: 10px 0 6px; padding-left: 20px; display: grid; gap: 6px; }
.howto a { overflow-wrap: anywhere; }
.viewer-img { width: 100%; height: auto; border-radius: 10px; background: #fff; display: block; }
.viewer-pdf { width: 100%; height: 70vh; border: 0; border-radius: 10px; background: #fff; display: block; }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .spin { animation-duration: 2.4s; } }

</style>

  function dueSubs(state, today) {
    today = today || todayISO();
    var out = [];
    var tp = today.split('-').map(Number);
    var minIndex = tp[0] * 12 + (tp[1] - 1) - 35;
    (state.subs || []).forEach(function (s) {
      if (s.active === false || !s.start) return;
      var sp = String(s.start).split('-').map(Number);
      var idx = Math.max(sp[0] * 12 + (sp[1] - 1), minIndex);
      var endIdx = tp[0] * 12 + (tp[1] - 1);
      for (; idx <= endIdx; idx++) {
        var y = Math.floor(idx / 12), m = idx % 12 + 1;
        var ym = y + '-' + pad(m);
        var dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
        var day = Math.min(Math.max(1, Math.round(num(s.day)) || 1), dim);
        var date = ym + '-' + pad(day);
        if (date < s.start || date > today) continue;
        if (s.end && date > s.end) continue;
        var booked = (state.expenses || []).some(function (e) { return e.subId === s.id && e.subMonth === ym; });
        if (!booked) out.push({ sub: s, ym: ym, date: date });
      }
    });
    out.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return out;
  }

  function niceMax(v) {
    if (v <= 0) return 100;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * p >= v) return steps[i] * p;
    return 10 * p;
  }
  function chartSVG(rep) {
    var max = 0;
    rep.months.forEach(function (m) { max = Math.max(max, m.in, m.out); });
    var top = niceMax(max);
    var W = 340, H = 150, x0 = 4, x1 = W - 4, y0 = 16, y1 = 124;
    var gw = (x1 - x0) / 12, bw = Math.max(4, gw * 0.3);
    var sy = function (v) { return y1 - (v / top) * (y1 - y0); };
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Recettes et dépenses par mois en ' + rep.year + '">';
    [0, 0.5, 1].forEach(function (f) {
      var y = sy(top * f);
      out += '<line class="grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
      if (f > 0) out += '<text x="' + x0 + '" y="' + (y - 4).toFixed(1) + '">' + h(eur(top * f).replace(',00', '')) + '</text>';
    });
    var L = 'JFMAMJJASOND';
    rep.months.forEach(function (m, i) {
      var cx = x0 + gw * i + gw / 2;
      if (m.in > 0) out += '<rect class="b-in" x="' + (cx - bw - 1).toFixed(1) + '" y="' + sy(m.in).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - sy(m.in)).toFixed(1) + '" rx="1.5"><title>' + h(C.monthLabelFr(rep.year + '-' + String(i + 1).padStart(2, '0')) + ' – recettes ' + eur(m.in)) + '</title></rect>';
      if (m.out > 0) out += '<rect class="b-out" x="' + (cx + 1).toFixed(1) + '" y="' + sy(m.out).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y1 - sy(m.out)).toFixed(1) + '" rx="1.5"><title>' + h(C.monthLabelFr(rep.year + '-' + String(i + 1).padStart(2, '0')) + ' – dépenses ' + eur(m.out)) + '</title></rect>';
      out += '<text x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + L[i] + '</text>';

    return out + '</svg>';

    el.addEventListener('input', function (e) { if (spec.onInput) spec.onInput(e); });
    el.addEventListener('change', function (e) { if (spec.onChange) spec.onChange(e); });

  function confirmBox(title, text, okLabel, danger) {
    return new Promise(function (res) {
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="m-t"><h3 id="m-t">' + h(title) + '</h3>' + (text ? '<p>' + h(text) + '</p>' : '') +

      function done(v) { m.remove(); document.removeEventListener('keydown', esc, true); res(v); }

  /* ---------- document editor ---------- */
  function sheetDocEdit(opts) {
    opts = opts || {};
    var c = cfg(), t = today();
    var existing = opts.id ? S.docs.find(function (x) { return x.id === opts.id; }) : null;
    var ed;
    if (existing) ed = clone(existing);
    else {
      var base = opts.from ? clone(opts.from) : { lines: [{ desc: '', qty: 1, unit: '', price: '' }], notes: '', clientId: '' };
      ed = {
        kind: opts.kind || 'invoice', clientId: base.clientId || '', client: base.client || null,
        lines: (base.lines && base.lines.length ? base.lines : [{ desc: '', qty: 1, unit: '', price: '' }]),
        notes: base.notes || '', lang: base.lang || c.lang, currency: base.currency || c.currency,
        ku: !!c.ku, vatRate: C.num(c.vatRate), date: t, status: 'open'
      };
      if (opts.convertFrom) { ed.fromQuote = opts.convertFrom.number; ed.fromQuoteId = opts.convertFrom.id; }
      ed.serviceDate = (opts.from && opts.from.serviceDate && opts.convertFrom) ? opts.from.serviceDate : C.fmtDate(t, ed.lang);
      ed.dueDate = C.addDays(t, C.num(c.paymentDays) || 14);
      ed.validUntil = C.addDays(t, C.num(c.quoteDays) || 30);
      renumber();
    }
    var isNew = !existing;
    var dueTouched = !isNew;
    function renumber() {
      var y = +String(ed.date).slice(0, 4) || new Date().getFullYear();
      var nn = C.nextNumber(S.docs, ed.kind, y, c);
      ed.number = nn.number; ed.seq = nn.seq; ed.year = y;
    }
    var descSuggest = {};
    S.docs.forEach(function (d) { (d.lines || []).forEach(function (l) { if (l.desc) descSuggest[l.desc] = 1; }); });

    function clientOptions() {
      var cl = S.clients.slice().sort(function (a, b) { return (a.name || '').localeCompare(b.name || '', 'fr'); });
      return [['', 'Choisir un client…']].concat(cl.map(function (x) { return [x.id, x.name + (x.city ? ' – ' + x.city : '')]; })).concat([['__new', '+ Nouveau client']]);
    }

  function toImageBlob(file, mediaTypes) {
    if (mediaTypes.indexOf(file.type) >= 0) return Promise.resolve(file);
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var sc = Math.min(1, 2400 / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) { if (b) res(b); else rej(new Error('encode')); }, 'image/jpeg', 0.9);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('decode')); };
      img.src = url;
    });
  }
  var pdfjsPromise = null;

  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

      s.onload = function () {

        L.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';

  function pdfToImages(file, maxPages) {
    return loadPdfJs().then(function (L) {
      return file.arrayBuffer().then(function (buf) { return L.getDocument({ data: buf }).promise; });
    }).then(function (pdf) {
      var n = Math.min(pdf.numPages, maxPages), out = [], chain = Promise.resolve();
      for (var i = 1; i <= n; i++) (function (p) {
        chain = chain.then(function () { return pdf.getPage(p); }).then(function (page) {
          var vp = page.getViewport({ scale: 1 });
          var sc = Math.min(2.5, 1800 / Math.max(vp.width, vp.height));
          var v2 = page.getViewport({ scale: sc });
          var cv = document.createElement('canvas'); cv.width = Math.ceil(v2.width); cv.height = Math.ceil(v2.height);
          var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          return page.render({ canvasContext: ctx, viewport: v2 }).promise.then(function () {
            return new Promise(function (res) { cv.toBlob(function (b) { if (b) out.push(b); res(); }, 'image/jpeg', 0.88); });
          });
        });
      })(i);
      return chain.then(function () { if (!out.length) throw new Error('empty'); return out; });
    });
  }

    function readForm(el) {

    function runScan(file) {

  function sigPad(canvas) {
    var ctx = null, drawing = false, last = null, dirty = false, w = 0, hgt = 0;
    function setup() {
      var rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      w = rect.width || 300; hgt = rect.height || 160;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(hgt * dpr);
      ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, hgt);
      ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14141a';
      dirty = false;
    }
    function pos(e) { var rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
    canvas.addEventListener('pointerdown', function (e) { drawing = true; last = pos(e); try { canvas.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } e.preventDefault(); });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing) return; var p = pos(e);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; dirty = true; e.preventDefault();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { canvas.addEventListener(n, function () { drawing = false; }); });
    setup();
    return { clear: setup, isEmpty: function () { return !dirty; }, data: function () { return canvas.toDataURL('image/png'); } };
  }

          put('subs', r).then(function () { closeSheet(); toast('Abonnement enregistré.'); }, function () {});
        } else if (b.dataset.a === 'del') {
          confirmBox('Supprimer cet abonnement ?', 'Les dépenses déjà enregistrées restent.', 'Supprimer').then(function (ok) { if (ok) remove('subs', ex.id).then(function () { closeSheet(); }, function () {}); });
        }
      }
    });
  }
  function bookSubs() {
    var due = C.dueSubs(S, today());
    if (!due.length) { toast('Rien à enregistrer.'); return; }
    var done = 0;
    var chain = Promise.resolve();
    due.forEach(function (x) {
      chain = chain.then(function () {
        return put('expenses', {
          date: x.date, vendor: x.sub.vendor || x.sub.name, desc: x.sub.name + ' – ' + C.monthLabelFr(x.ym), category: x.sub.category || 'software',
          amount: C.r2(x.sub.amount), cur: 'EUR', proPct: C.expPct(x.sub), method: x.sub.method || 'Carte', subId: x.sub.id, subMonth: x.ym, example: x.sub.example ? true : undefined
        }).then(function () { done++; });
      });
    });
    chain.then(function () { toast(done + (done > 1 ? ' dépenses enregistrées.' : ' dépense enregistrée.') + ' Scanne les factures pour les justificatifs.'); }, function () {});
  }


  /* ---------- settings ---------- */
  function sheetSettings() {
    var r = cfg();
    var spec = openSheet({
      render: function () {
        return shell('Mes informations', '<div class="form">' +
          '<div class="fs"><h3>Identité</h3>' + fld('st-name', 'Ton nom', r.name, { auto: 'name' }) + fld('st-company', 'Nom commercial ou marque (facultatif)', r.company, { ph: 'Ex. KABA BOY TV' }) +
          fld('st-street', 'Rue et numéro', r.street, { auto: 'street-address' }) + '<div class="grid2">' + fld('st-zip', 'Code postal', r.zip, { auto: 'postal-code' }) + fld('st-city', 'Ville', r.city, { auto: 'address-level2' }) + '</div>' +
          fld('st-country', 'Pays', r.country) + '<div class="grid2 wrap1">' + fld('st-email', 'E-mail', r.email, { type: 'email', auto: 'email' }) + fld('st-phone', 'Téléphone', r.phone, { type: 'tel', auto: 'tel' }) + '</div>' + fld('st-web', 'Site ou page (facultatif)', r.web) + '</div>' +
          '<div class="fs"><h3>Impôts</h3>' + fld('st-tax', 'Numéro fiscal (Steuernummer)', r.taxId, { ph: 'Ex. 12/345/67890', hint: 'Obligatoire sur chaque facture (ou ton n° de TVA).' }) + fld('st-vat', 'N° de TVA intracommunautaire (USt-IdNr., facultatif)', r.vatId) +
          '<label class="toggle"><input type="checkbox" id="st-ku"' + (r.ku ? ' checked' : '') + '><span>Kleinunternehmer (§ 19 UStG)<small>Pas de TVA sur tes factures ; la mention légale est ajoutée toute seule.</small></span></label>' +
          fld('st-rate', 'Taux de TVA si tu n’es pas Kleinunternehmer (%)', r.vatRate, { mode: 'decimal' }) +
          sel('st-cm', 'Collectes (KABA BOY CARE)', C.collectMode(r), [['transit', 'Seule ma part compte (argent qui transite)'], ['full', 'Tout le montant collecté compte en recette']]) + '</div>' +
          '<div class="fs"><h3>Banque (pied de page des factures)</h3>' + fld('st-holder', 'Titulaire du compte (si différent)', r.bankHolder) + fld('st-iban', 'IBAN', r.iban, { ph: 'DE00 0000 0000 0000 0000 00' }) +
          '<div class="grid2">' + fld('st-bic', 'BIC', r.bic) + fld('st-bank', 'Banque', r.bank) + '</div></div>' +
          '<div class="fs"><h3>Factures et devis</h3><div class="grid2">' + fld('st-ip', 'Préfixe des factures', r.invoicePrefix) + fld('st-qp', 'Préfixe des devis', r.quotePrefix) + '</div>' +
          '<div class="grid2">' + fld('st-pd', 'Délai de paiement (jours)', r.paymentDays, { type: 'number', mode: 'numeric' }) + fld('st-qd', 'Validité des devis (jours)', r.quoteDays, { type: 'number', mode: 'numeric' }) + '</div>' +
          '<div class="grid2">' + sel('st-lang', 'Langue par défaut', r.lang, [['de', 'Allemand'], ['fr', 'Français'], ['en', 'Anglais']]) + sel('st-cur', 'Devise par défaut', r.currency, [['EUR', 'Euro (€)'], ['XAF', 'Franc CFA'], ['USD', 'Dollar ($)']]) + '</div></div>' +
          '<button class="btn primary block" data-a="save">Enregistrer</button></div>', saveBtn());
      },
      onClick: function (e) {
        var b = e.target.closest('[data-a="save"]'); if (!b) return; var el = spec.el;
        var p = {
          name: val(el, 'st-name').trim(), company: val(el, 'st-company').trim(), street: val(el, 'st-street').trim(), zip: val(el, 'st-zip').trim(), city: val(el, 'st-city').trim(),
          country: val(el, 'st-country').trim(), email: val(el, 'st-email').trim(), phone: val(el, 'st-phone').trim(), web: val(el, 'st-web').trim(),
          taxId: val(el, 'st-tax').trim(), vatId: val(el, 'st-vat').trim(), ku: !!val(el, 'st-ku'), vatRate: C.num(val(el, 'st-rate')) || 19,
          bankHolder: val(el, 'st-holder').trim(), iban: val(el, 'st-iban').replace(/\s+/g, '').toUpperCase(), bic: val(el, 'st-bic').trim().toUpperCase(), bank: val(el, 'st-bank').trim(),
          invoicePrefix: val(el, 'st-ip').trim() || 'RE', quotePrefix: val(el, 'st-qp').trim() || 'AN',
          paymentDays: Math.max(0, Math.round(C.num(val(el, 'st-pd')))) || 14, quoteDays: Math.max(1, Math.round(C.num(val(el, 'st-qd')))) || 30,
          lang: val(el, 'st-lang'), currency: val(el, 'st-cur'), collectMode: val(el, 'st-cm') === 'full' ? 'full' : 'transit'
        };
        saveSettings(p).then(function () { closeSheet(); toast('Informations enregistrées.'); }, function () {});
      }
    });
  }
  function fileToLogo(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 420, sc = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
        var ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cv.width, cv.height);
        var data = cv.toDataURL('image/png');
        if (data.length > 180000) { ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); data = cv.toDataURL('image/jpeg', 0.85); }
        URL.revokeObjectURL(url); res(data);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('image')); };
      img.src = url;
    });
  }

  /* ---------- global actions ---------- */
  function deleteExamples() {
    confirmBox('Supprimer tous les exemples ?', 'Seuls les éléments marqués « Exemple » seront supprimés. Tes vraies données restent.', 'Supprimer les exemples').then(function (ok) {
      if (!ok) return;
      var chain = Promise.resolve(), n = 0;
      COLLS.forEach(function (c) { S[c].filter(function (x) { return x.example; }).forEach(function (x) { chain = chain.then(function () { n++; return remove(c, x.id); }); }); });
      chain.then(function () { toast(n + ' exemple(s) supprimé(s).'); }, function () {});
    });
  }
  function exportEuer() {
    var J = jsPDFCtor(); if (!J) { toast('Le module PDF n’a pas pu se charger.'); return; }
    var rep = C.euer(S, S.year);
    offerFile('EUER-Vorbereitung-' + S.year + '.pdf', C.buildEuerPdf(rep, cfg(), J, today()).output('blob'));
  }
  function exportCsv() {
    var rep = C.euer(S, S.year);
    offerFile('Journal-' + S.year + '.csv', C.journalCsv(rep));
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('#sheets') || e.target.closest('.modal')) return;
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act;
    if (a === 'tab') { S.tab = t.dataset.tab; renderMain(); window.scrollTo(0, 0); }
    else if (a === 'seg') { S.seg[t.dataset.k] = t.dataset.v; renderMain(); }
    else if (a === 'docfilter') { S.docFilter = t.dataset.v; renderMain(); }
    else if (a === 'expfilter') { S.expFilter = t.dataset.v; renderMain(); }
    else if (a === 'year') { S.year += +t.dataset.d; renderMain(); }
    else if (a === 'goto') {
      S.tab = t.dataset.a;
      if (t.dataset.a === 'inv') { S.seg.inv = 'docs'; S.docFilter = t.dataset.b; }
      if (t.dataset.a === 'exp') { S.seg.exp = 'list'; S.expFilter = t.dataset.b; }
      renderMain(); window.scrollTo(0, 0);
    }
    else if (a === 'doc') sheetDoc(t.dataset.id);
    else if (a === 'newdoc') sheetDocEdit({ kind: t.dataset.kind });
    else if (a === 'client') sheetClient(t.dataset.id);
    else if (a === 'newclient') sheetClient(null);
    else if (a === 'exp') sheetExpense(t.dataset.id);
    else if (a === 'newexp') sheetExpense(null);
    else if (a === 'scanexp') sheetExpense(null, { scan: true });
    else if (a === 'bulkexp') sheetBulk();
    else if (a === 'homeoffice') sheetHomeoffice(S.year);
    else if (a === 'inc') { var ie = S.incomes.find(function (x) { return x.id === t.dataset.id; }); if (ie && ie.collect) sheetCollectDetail(ie.id); else sheetIncome(t.dataset.id); }
    else if (a === 'newcollect') sheetCollecte(null);
    else if (a === 'newinc') sheetIncome(null);
    else if (a === 'sub') sheetSub(t.dataset.id);
    else if (a === 'newsub') sheetSub(null);
    else if (a === 'booksubs') bookSubs();
    else if (a === 'settings') sheetSettings();
    else if (a === 'delexamples') deleteExamples();
    else if (a === 'euerpdf') exportEuer();
    else if (a === 'journalcsv') exportCsv();
    else if (a === 'ghconnect') ghConnect($('#main'), t);
    else if (a === 'ghsetup') sheetGitHub();
    else if (a === 'ghsync') { if (S.mode === 'gh') { GH.status = 'syncing'; onData(); ghSync().then(function () { if (GH.status === 'ok') toast('Synchronisé avec GitHub.'); }); } }
    else if (a === 'airemove') { lsSet(AI_KEY, null); setupAdapters(); capsChanged(); toast('Clé IA retirée de ce téléphone.'); }
    else if (a === 'rmlogo') saveSettings({ logo: '' }).then(function () { toast('Logo retiré.'); }, function () {});
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { S.q = e.target.value; renderMain(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'logo-file') {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      fileToLogo(f).then(function (data) { return saveSettings({ logo: data }); }).then(function () { toast('Logo enregistré.'); }, function () { toast('Impossible de lire cette image.'); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheets.length && !document.querySelector('.modal')) closeSheet();
  });

  if (STANDALONE) {
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-blobopen]'); if (!b) return;
      e.preventDefault(); e.stopPropagation();
      openBlobViewer(b.getAttribute('data-blobopen'), b.getAttribute('data-type'));
    }, true);
    new MutationObserver(function () { hydrateBlobs(document); }).observe(document.body, { childList: true, subtree: true });
  }

  $('#toast').hidden = true;
  renderMain();
  initStore();
})();

</script>
